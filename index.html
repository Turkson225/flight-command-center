<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <script>
      try {
        const savedTheme = localStorage.getItem('flight-command-center-theme');
        const initialTheme = ['midnight', 'monochrome', 'blackwhite', 'military'].includes(savedTheme)
          ? savedTheme
          : savedTheme === 'light' ? 'monochrome' : 'midnight';
        document.documentElement.dataset.theme = initialTheme;
        document.querySelector('meta[name="theme-color"]').content = {
          midnight: '#071018', monochrome: '#050505', blackwhite: '#000000', military: '#11150e'
        }[initialTheme];
      } catch { document.documentElement.dataset.theme = 'midnight'; }
    </script>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="description" content="Flight Command Center — fixed-wing telemetry, navigation and aircraft health." />
    <title>Flight Command Center · FD-X</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
